name: CRM channel-neutral integration
on:
  push:
    branches: [feature/channel-neutral-crm-integration]
  pull_request:
    branches: [feature/workspace-assistant-budget-planner]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check client-access.js
      - run: node tests/channel-neutral-contract.cjs
      - run: node tests/workspace-assistant-contract.cjs
