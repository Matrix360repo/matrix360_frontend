name: Frontend verification recovery
on:
  push:
    branches: [feature/auth-email-verification-recovery]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check client-access.js
      - run: node tests/email-verification-contract.cjs
